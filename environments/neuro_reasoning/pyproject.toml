[project]
name = "neuro-reasoning"
version = "0.1.0"
description = "Procedurally generated, exactly verified reasoning tasks on EEG brain-computer-interface experimental design."
tags = ["neuroscience", "eeg", "bci", "science", "reasoning", "single-turn", "eval", "train"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuro_reasoning"]
