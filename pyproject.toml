[project]
name = "neuro-reasoning-workspace"
version = "0.1.0"
description = "Development workspace for the neuro-reasoning verifiers environment (tests, eval configs, analysis scripts)."
requires-python = ">=3.14"
dependencies = [
    "verifiers>=0.3.1",
    "neuro-reasoning",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
neuro-reasoning = { path = "environments/neuro_reasoning", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
